<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAI Volunteers</title>

    <link rel="stylesheet" href="css/volunteers.css">
</head>
<body>

    <div class="container">

        <h1>🤝 Volunteer Management</h1>

        <div class="stats">

            <div class="card">
                <h2 id="totalVolunteers">0</h2>
                <p>Total Volunteers</p>
            </div>

            <div class="card">
                <h2 id="availableVolunteers">0</h2>
                <p>Available</p>
            </div>

            <div class="card">
                <h2 id="busyVolunteers">0</h2>
                <p>Busy</p>
            </div>

        </div>

        <div id="volunteerContainer"
             class="volunteer-container">

        </div>

    </div>

    <script src="js/volunteers.js"></script>

</body>
</html>

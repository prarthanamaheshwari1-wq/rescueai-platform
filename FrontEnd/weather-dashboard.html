<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Intelligence Dashboard</title>

    <link rel="stylesheet" href="css/weather-dashboard.css">
</head>

<body>

    <div class="container">

        <h1>🌦 RescueAI Weather Intelligence</h1>

        <div class="search-box">

            <input type="text" id="cityInput" placeholder="Enter City Name">

            <button onclick="searchWeather()">
                Search
            </button>

        </div>

        <div class="weather-grid">

            <div class="card">
                <h3>📍 City</h3>
                <p id="city">Loading...</p>
            </div>

            <div class="card">
                <h3>🌡 Temperature</h3>
                <p id="temperature">Loading...</p>
            </div>

            <div class="card">
                <h3>💧 Humidity</h3>
                <p id="humidity">Loading...</p>
            </div>

            <div class="card">
                <h3>💨 Wind Speed</h3>
                <p id="windSpeed">Loading...</p>
            </div>

            <div class="card">
                <h3>☁ Condition</h3>
                <p id="condition">Loading...</p>
            </div>

            <div class="card">
                <h3>⚠ Risk Level</h3>
                <p id="riskLevel">Loading...</p>
            </div>

            <div class="card">
                <h3>🚨 Disaster Type</h3>
                <p id="disasterType">Loading...</p>
            </div>

        </div>

    </div>

    <script src="js/weather-dashboard.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAI Disaster Map</title>

    <link rel="stylesheet" href="css/map-dashboard.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <div class="container">

        <h1>🗺️ RescueAI Disaster Map</h1>

        <div class="stats-container">

            <div class="card">
                <h2 id="totalReports">0</h2>
                <p>Total Reports</p>
            </div>

            <div class="card">
                <h2 id="pendingReports">0</h2>
                <p>Pending</p>
            </div>

            <div class="card">
                <h2 id="verifiedReports">0</h2>
                <p>Verified</p>
            </div>

            <div class="card">
                <h2 id="resolvedReports">0</h2>
                <p>Resolved</p>
            </div>

        </div>

        <div id="map"></div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/map-dashboard.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAI Disaster Map</title>

    <link rel="stylesheet" href="css/map-dashboard.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <div class="container">

        <h1>🗺️ RescueAI Disaster Map</h1>

        <div class="stats-container">

            <div class="card">
                <h2 id="totalReports">0</h2>
                <p>Total Reports</p>
            </div>

            <div class="card">
                <h2 id="pendingReports">0</h2>
                <p>Pending</p>
            </div>

            <div class="card">
                <h2 id="verifiedReports">0</h2>
                <p>Verified</p>
            </div>

            <div class="card">
                <h2 id="resolvedReports">0</h2>
                <p>Resolved</p>
            </div>

        </div>

        <div class="map-filters">

            <label for="severityFilter">
                Filter by Severity:
            </label>

            <select id="severityFilter">
                <option value="All">All Incidents</option>
                <option value="High">High Risk</option>
                <option value="Medium">Medium Risk</option>
                <option value="Low">Low Risk</option>
            </select>

        </div>

        <div class="weather-panel">

            <h2>🌦️ Weather Intelligence</h2>

            <!-- Weather City Search -->
            <div class="weather-search">

                <input
                    type="text"
                    id="mapWeatherCityInput"
                    placeholder="Enter city name"
                >

                <button onclick="searchMapWeather()">
                    🔍 Search
                </button>

            </div>

            <div class="weather-info">

                <div>
                    <span>📍 City</span>
                    <strong id="mapWeatherCity">Loading...</strong>
                </div>

                <div>
                    <span>🌡 Temperature</span>
                    <strong id="mapWeatherTemperature">Loading...</strong>
                </div>

                <div>
                    <span>💧 Humidity</span>
                    <strong id="mapWeatherHumidity">Loading...</strong>
                </div>

                <div>
                    <span>💨 Wind</span>
                    <strong id="mapWeatherWind">Loading...</strong>
                </div>

                <div>
                    <span>⚠️ Risk</span>
                    <strong id="mapWeatherRisk">Loading...</strong>
                </div>

                <div>
                    <span>🚨 Disaster</span>
                    <strong id="mapWeatherDisaster">Loading...</strong>
                </div>

            </div>

        </div>

        <div class="map-container">

            <div class="legend">
                <h4>Map Legend</h4>

                <p><span class="high-dot"></span> High Severity</p>

                <p><span class="medium-dot"></span> Medium Severity</p>

                <p><span class="low-dot"></span> Low Severity</p>

                <p><span class="blue-dot"></span> Resources</p>
            </div>

            <div id="map"></div>

        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/map-dashboard.js"></script>

</body>

</html>

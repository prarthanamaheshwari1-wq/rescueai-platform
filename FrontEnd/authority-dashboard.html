<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAI Authority Dashboard</title>

    <link rel="stylesheet" href="css/authority-dashboard.css">
</head>

<body>

    <div class="container">

        <h1>🚨 RescueAI Authority Dashboard</h1>

        <div class="stats-container">

            <div class="card">
                <h3>Total Reports</h3>
                <p id="totalReports">0</p>
            </div>

            <div class="card">
                <h3>Submitted</h3>
                <p id="submittedReports">0</p>
            </div>

            <div class="card">
                <h3>Verified</h3>
                <p id="verifiedReports">0</p>
            </div>

            <div class="card">
                <h3>Resolved</h3>
                <p id="resolvedReports">0</p>
            </div>

            <div class="card">
                <h3>Rejected</h3>
                <p id="rejectedReports">0</p>
            </div>

        </div>

        <div class="quick-actions">

            <a href="ai-analysis.html" class="action-btn">
                🤖 AI Analysis
            </a>

            <a href="resources.html" class="action-btn">
                📦 Resources
            </a>

            <a href="volunteers.html" class="action-btn">
                👥 Volunteers
            </a>

            <a href="map-dashboard.html" class="action-btn">
                🗺️ Disaster Map
            </a>

        </div>

        <!-- ALERT SECTION -->

        <h2>🚨 Active Alerts</h2>

        <div id="alertsContainer">

            <div class="card">
                No Active Alerts
            </div>

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Severity</th>
                    <th>Location</th>
                    <th>Current Status</th>
                    <th>Change Status</th>
                    <th>Update</th>
                    <th>Assign Resource</th>
                    <th>Assign Volunteer</th>
                    <th>Details</th>
                </tr>
            </thead>

            <tbody id="reportsTableBody">

            </tbody>

        </table>

    </div>

    <script src="js/authority-dashboard.js"></script>

</body>

</html>
